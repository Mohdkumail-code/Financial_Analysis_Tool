<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Bab-al-Sabr Attar Shop</title>
  <link rel="stylesheet" href="styles.css" />
  <head>
  <meta charset="UTF-8" />
  <title>Bab-al-Sabr Attar Shop</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      background: #f4f4f5;
      color: #111827;
    }

    .header {
      background: #111827;
      color: #f9fafb;
      padding: 1.5rem;
      text-align: center;
    }

    .header h1 {
      font-size: 1.8rem;
      margin-bottom: 0.25rem;
    }

    .container {
      max-width: 1100px;
      margin: 1.5rem auto;
      padding: 0 1rem;
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-gap: 1.5rem;
    }

    .card {
      background: #ffffff;
      border-radius: 0.75rem;
      padding: 1rem 1.25rem 1.25rem;
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.08);
    }

    .card h2 {
      margin-bottom: 0.75rem;
      font-size: 1.2rem;
    }

    form {
      margin-top: 0.5rem;
    }

    .form-group {
      margin-bottom: 0.75rem;
      display: flex;
      flex-direction: column;
    }

    .form-group label {
      font-size: 0.9rem;
      margin-bottom: 0.25rem;
    }

    .form-group input,
    .form-group select {
      padding: 0.4rem 0.5rem;
      border-radius: 0.4rem;
      border: 1px solid #d4d4d8;
      font-size: 0.9rem;
    }

    .form-group input:focus,
    .form-group select:focus {
      outline: none;
      border-color: #4f46e5;
      box-shadow: 0 0 0 2px rgba(79, 70, 229, 0.2);
    }

    .form-actions {
      display: flex;
      gap: 0.5rem;
      margin-top: 0.5rem;
    }

    .btn {
      border: none;
      border-radius: 9999px;
      padding: 0.45rem 0.9rem;
      font-size: 0.9rem;
      cursor: pointer;
    }

    .btn.primary {
      background: #4f46e5;
      color: #f9fafb;
    }

    .btn.primary:hover {
      background: #4338ca;
    }

    .btn.secondary {
      background: #e5e7eb;
      color: #111827;
    }

    .btn.secondary:hover {
      background: #d4d4d8;
    }

    .btn.small {
      padding: 0.25rem 0.6rem;
      font-size: 0.8rem;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 0.5rem;
      font-size: 0.85rem;
    }

    thead {
      background: #f3f4f6;
    }

    th,
    td {
      padding: 0.45rem 0.35rem;
      border-bottom: 1px solid #e5e7eb;
      text-align: left;
    }

    th {
      font-weight: 600;
      font-size: 0.8rem;
    }

    tbody tr:hover {
      background: #f9fafb;
    }

    .summary {
      margin-top: 0.75rem;
      display: flex;
      justify-content: flex-end;
      font-size: 0.9rem;
    }

    .summary strong {
      margin-left: 0.35rem;
    }

    .footer {
      text-align: center;
      padding: 1rem;
      font-size: 0.8rem;
      color: #6b7280;
    }

    .hint {
      font-size: 0.75rem;
      color: #6b7280;
      margin-top: 0.25rem;
    }

    .actions-cell {
      display: flex;
      gap: 0.25rem;
    }

    @media (max-width: 900px) {
      .container {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head
</head>
<body>
  <header class="header">
    <h1>Bab-al-Sabr Attar Shop</h1>
    <p>Owner: <strong>Kumail Zaidi ibn Zia Haider</strong></p>
  </header>

  <main class="container">
    <section class="card">
      <h2>Add / Edit Attar</h2>
      <form id="attar-form">
        <input type="hidden" id="attar-id" />

        <div class="form-group">
          <label for="attar-name">Name</label>
          <input type="text" id="attar-name" required />
        </div>

        <div class="form-group">
          <label for="attar-description">Description</label>
          <input type="text" id="attar-description" />
        </div>

        <div class="form-group">
          <label for="attar-quantity">Quantity (stock)</label>
          <input type="number" id="attar-quantity" min="0" required />
        </div>

        <div class="form-group">
          <label for="attar-cost">Cost price per unit</label>
          <input type="number" step="0.01" id="attar-cost" min="0" required />
        </div>

        <div class="form-group">
          <label for="attar-sell">Selling price per unit</label>
          <input type="number" step="0.01" id="attar-sell" min="0" required />
        </div>

        <div class="form-actions">
          <button type="submit" class="btn primary" id="save-attar-btn">Save Attar</button>
          <button type="button" class="btn secondary" id="reset-attar-btn">Clear</button>
        </div>
      </form>
    </section>

    <section class="card">
      <h2>Attar Inventory</h2>
      <table>
        <thead>
          <tr>
            <th>Name</th>
            <th>Qty</th>
            <th>Cost</th>
            <th>Sell</th>
            <th>Description</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="attars-table-body">
          <!-- Filled by JS -->
        </tbody>
      </table>
    </section>

    <section class="card">
      <h2>Record Sale</h2>
      <form id="sale-form">
        <div class="form-group">
          <label for="sale-attar">Attar</label>
          <select id="sale-attar" required>
            <!-- Filled by JS -->
          </select>
        </div>

        <div class="form-group">
          <label for="sale-quantity">Quantity</label>
          <input type="number" id="sale-quantity" min="1" required />
        </div>

        <div class="form-group">
          <label for="sale-unit-price">Unit price</label>
          <input type="number" step="0.01" id="sale-unit-price" min="0" required />
          <small id="sale-price-hint" class="hint"></small>
        </div>

        <div class="form-actions">
          <button type="submit" class="btn primary">Record Sale</button>
        </div>
      </form>
    </section>

    <section class="card">
      <h2>Sales History</h2>
      <table>
        <thead>
          <tr>
            <th>Date / Time</th>
            <th>Attar</th>
            <th>Qty</th>
            <th>Unit</th>
            <th>Total</th>
          </tr>
        </thead>
        <tbody id="sales-table-body">
          <!-- Filled by JS -->
        </tbody>
      </table>
      <div class="summary">
        <span>Total Revenue: </span>
        <strong id="total-revenue">0.00</strong>
      </div>
    </section>
  </main>

  <footer class="footer">
    <p>&copy; <span id="year"></span> Bab-al-Sabr Attar Shop</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
